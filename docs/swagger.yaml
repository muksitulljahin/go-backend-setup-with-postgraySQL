paths:
  /api/v1/colors:
    post:
      consumes:
        - application/json
      description: Only Admin and Super Admin can create colors
      parameters:
        - description: Color Creation Payload
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/colors.CreateColorDTO"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
              - $ref: "#/definitions/response.APIResponse"
              - properties:
                  data:
                    $ref: "#/definitions/colors.ColorResponseDTO"
                type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/response.APIResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/response.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/response.APIResponse"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/response.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/response.APIResponse"
      security:
        - BearerAuth: []
      summary: Create Product Color
      tags:
        - Colors
  /api/v1/colors/{id}:
    delete:
      description: Only Admin and Super Admin can delete colors
      parameters:
        - description: Color ID (MongoDB-style ObjectID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/response.APIResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/response.APIResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/response.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/response.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/response.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/response.APIResponse"
      security:
        - BearerAuth: []
      summary: Delete Product Color
      tags:
        - Colors
    get:
      description: Only Admin and Super Admin can retrieve a single color by its ID
      parameters:
        - description: Color ID (MongoDB-style ObjectID)
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/response.APIResponse"
              - properties:
                  data:
                    $ref: "#/definitions/colors.ColorResponseDTO"
                type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/response.APIResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/response.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/response.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/response.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/response.APIResponse"
      security:
        - BearerAuth: []
      summary: Get Product Color by ID
      tags:
        - Colors
    put:
      consumes:
        - application/json
      description: Only Admin and Super Admin can update colors
      parameters:
        - description: Color ID (MongoDB-style ObjectID)
          in: path
          name: id
          required: true
          type: string
        - description: Color Update Payload
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/colors.UpdateColorDTO"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/response.APIResponse"
              - properties:
                  data:
                    $ref: "#/definitions/colors.ColorResponseDTO"
                type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/response.APIResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/response.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/response.APIResponse"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/response.APIResponse"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/response.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/response.APIResponse"
      security:
        - BearerAuth: []
      summary: Update Product Color
      tags:
        - Colors
  /api/v1/colors/list:
    get:
      description: Only Admin and Super Admin can retrieve list of all colors
      parameters:
        - description: Search colors by name or color code
          in: query
          name: search
          type: string
        - description: Filter colors by active status (true/false)
          in: query
          name: isActive
          type: boolean
        - description: Page number (defaults to 1)
          in: query
          name: page
          type: integer
        - description: Items per page (defaults to 0 / all)
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: "#/definitions/response.APIResponse"
              - properties:
                  data:
                    properties:
                      list:
                        items:
                          $ref: "#/definitions/colors.ColorResponseDTO"
                        type: array
                      total_count:
                        type: integer
                    type: object
                type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/response.APIResponse"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/response.APIResponse"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/response.APIResponse"
      security:
        - BearerAuth: []
      summary: Get All Product Colors
      tags:
        - Colors
